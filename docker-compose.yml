services:
  backend:
    build:
      context: ./backend
      dockerfile: MeetingRoomBooking.Api/Dockerfile
    ports:
      - "5189:5189"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5189
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
